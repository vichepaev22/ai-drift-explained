
name: Deploy Russian AI Research Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ai-atlas-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Build data and publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Russian Atlas
        uses: actions/checkout@v4
      - name: Set up Node for static and unit tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and research metrics
        run: |
          node --check app.js
          node --check visual.js
          node --check insights.js
          node --check insight-art.js
          node --check search.js
          node --check search-worker.js
          node --check search-core.mjs
          node --check metrics.mjs
          node --test tests/*.test.mjs
      - name: Modern Web Guidance compatibility audit (informational)
        continue-on-error: true
        env:
          DISABLE_TELEMETRY: '1'
        run: npx --yes modern-web-guidance@1.0.0 legacy-scan .
      - name: Restore immutable research corpus cache
        uses: actions/cache@v4
        with:
          path: _site/data
          key: drift-corpus-${{ hashFiles('insights-data.json') }}
      - name: Download and validate real Drift Inspector research data
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,concurrent.futures,shutil,time,sys
          ORIGIN='https://drift.autumnfleet.com/d/all-conf/8284613a3ebc/'
          MIRROR='https://vichepaev22.github.io/ai-drift-explained/data/'
          OUT='_site/data'
          os.makedirs(OUT+'/derived',exist_ok=True)
          with open('insights-data.json',encoding='utf-8') as f:
              expected=json.load(f)['provenance']['sourceFingerprint']
          base_files=['manifest.json','topics.json','map.json','members.json','papers.json','derived/aggregates.json']
          def valid_manifest(m):
              return m.get('source_fingerprint')==expected and m.get('counts',{}).get('papers')==117888 and m['counts'].get('claims')==570179 and m['counts'].get('topics')==98
          def corpus_files(m):
              return base_files+[f'claims-{i:02d}.json' for i in range(m['claimShards'])]+[f'authors-{i:02d}.json' for i in range(m['authorShards'])]
          try:
              with open(OUT+'/manifest.json',encoding='utf-8') as f: cached=json.load(f)
              if valid_manifest(cached) and all(os.path.getsize(os.path.join(OUT,x))>0 for x in corpus_files(cached)):
                  print('Cache hit: complete, fingerprint-matched scientific corpus. No downloads required.',flush=True)
                  sys.exit(0)
          except (OSError,ValueError,KeyError) as e:
              print('Cache not complete:',str(e)[:180],flush=True)
          sources=[]
          try:
              req=urllib.request.Request(MIRROR+'manifest.json',headers={'User-Agent':'AI-Atlas/1.1'})
              with urllib.request.urlopen(req,timeout=15) as r: mirror_manifest=json.load(r)
              if valid_manifest(mirror_manifest):
                  sources.append((MIRROR,35,2))
                  print('Verified published GitHub Pages corpus mirror',flush=True)
              else: print('Published mirror fingerprint differs: using original source',flush=True)
          except Exception as e:
              print('Published mirror unavailable; original source remains enabled:',repr(e),flush=True)
          sources.append((ORIGIN,180,6))
          def fetch(rel):
              dest=os.path.join(OUT,rel)
              os.makedirs(os.path.dirname(dest),exist_ok=True)
              if os.path.isfile(dest) and os.path.getsize(dest)>0:
                  return rel,os.path.getsize(dest),'cached'
              last=None
              for base,timeout,attempts in sources:
                  for attempt in range(attempts):
                      try:
                          req=urllib.request.Request(base+rel,headers={'User-Agent':'AI-Atlas/1.1 (research mirror)'})
                          with urllib.request.urlopen(req,timeout=timeout) as r,open(dest+'.part','wb') as f:
                              shutil.copyfileobj(r,f,length=128*1024)
                          if os.path.getsize(dest+'.part')==0: raise ValueError('Empty response')
                          os.replace(dest+'.part',dest)
                          return rel,os.path.getsize(dest),base
                      except Exception as e:
                          last=e
                          if os.path.exists(dest+'.part'): os.unlink(dest+'.part')
                          if attempt+1<attempts: time.sleep(min(3*(attempt+1),15))
              raise RuntimeError(f'{rel}: failed using all validated sources; last error: {last}')
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for rel,size,src in pool.map(fetch,base_files): print('Core file',rel,size,src,flush=True)
          with open(OUT+'/manifest.json',encoding='utf-8') as f: m=json.load(f)
          if not valid_manifest(m): raise RuntimeError('Downloaded scientific dataset version differs from editorial reference')
          shards=[f'claims-{i:02d}.json' for i in range(m['claimShards'])]
          shards += [f'authors-{i:02d}.json' for i in range(m['authorShards'])]
          total=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for idx,(rel,size,src) in enumerate(pool.map(fetch,shards),1):
                  total+=size
                  if idx%25==0: print('Verified shards',idx,'/',len(shards),'bytes',total,flush=True)
          assert all(os.path.isfile(os.path.join(OUT,x)) and os.path.getsize(os.path.join(OUT,x))>0 for x in corpus_files(m))
          print('COMPLETE: fingerprint-matched scientific data,',len(shards),'shards,',total,'bytes',flush=True)
          PY
      - name: Prepare static website
        run: |
          mkdir -p _site/assets
          cp index.html style.css app.js visual.js insights.js insight-art.js insights-data.json metrics.mjs search.js search-worker.js search-core.mjs _site/
          cp assets/favicon.svg assets/share.png _site/assets/
          mkdir -p _site/vendor
          curl --fail --location --retry 3 --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js -o _site/vendor/three.module.min.js
          curl --fail --location --retry 3 --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.core.min.js -o _site/vendor/three.core.min.js
          touch _site/.nojekyll
          test -s _site/metrics.mjs
          test -s _site/insights.js
          test -s _site/search.js
          test -s _site/search-worker.js
          test -s _site/search-core.mjs
          test -s _site/insight-art.js
          test -s _site/insights-data.json
          python3 - <<'PYINSIGHTS'
          import json
          from pathlib import Path
          manifest=json.loads(Path('_site/data/manifest.json').read_text())
          content=json.loads(Path('_site/insights-data.json').read_text())
          assert manifest['source_fingerprint']==content['provenance']['sourceFingerprint'], 'Insight data version mismatch'
          assert len(content['topics'])==manifest['counts']['topics']==98, 'Topic count mismatch'
          print('Validated 98 explanatory entries against source fingerprint',flush=True)
          PYINSIGHTS
          test -s _site/data/map.json
          test -s _site/data/members.json
          test -s _site/data/papers.json
          python3 - <<'PYSEARCH'
          import json
          with open('_site/data/papers.json',encoding='utf-8') as f: p=json.load(f)
          print('PAPER INDEX SCHEMA:',[(key,type(value).__name__,len(value) if hasattr(value,'__len__') else '-') for key,value in p.items()],flush=True)
          PYSEARCH
          du -sh _site
      - name: Install Chromium browser for end-to-end smoke test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test published-site behaviour in a real browser
        run: node tests/browser-smoke.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

